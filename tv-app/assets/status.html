<!doctype html><html><head><meta charset="utf-8"><style>
/* The TV app's own screens, styled like Google TV's: plain white and grey on near-black, one thing per screen,
   text on the left, picture on the right, inside the TV's safe margins (5%). */
html,body{margin:0;height:100%;background:#131314;color:#e3e3e3;font-family:"Google Sans",Roboto,sans-serif}
.frame{position:fixed;top:54px;right:96px;bottom:54px;left:96px;display:flex;flex-direction:column}
.brand{height:52px;width:auto;align-self:flex-start;opacity:.9}
.main{flex:1;display:flex;align-items:center;gap:96px}
.text{flex:1;max-width:980px}
.side{width:440px;display:flex;justify-content:center}
h1{font-size:60px;line-height:1.15;margin:0 0 24px;font-weight:400;color:#f1f3f4}
p{font-size:30px;line-height:1.45;margin:0 0 18px;color:#c4c7c5}
ol{font-size:30px;line-height:1.6;margin:4px 0 22px;padding-left:44px;color:#e3e3e3}
ol b{font-weight:500;color:#fff}
.url{font-size:22px;color:#9aa0a6;word-break:break-all}
.small{font-size:22px;color:#8e918f;margin-top:26px}
#hint{font-size:26px;color:#c4c7c5;display:none}
#qr{background:#fff;padding:24px;border-radius:16px;display:none}
#qr img{display:block;width:400px;height:400px;image-rendering:pixelated}
#icon{display:none}
#icon svg{width:200px;height:200px;fill:#dadce0;display:block}
.spin{width:120px;height:120px;border-radius:50%;border:10px solid #3c4043;border-top-color:#e8eaed;
  animation:spin 1.1s linear infinite;box-sizing:border-box}
@keyframes spin{to{transform:rotate(360deg)}}
#pin{display:none;gap:20px;margin:8px 0 22px}
#pin span{width:88px;height:108px;border-radius:12px;background:#1f1f20;border:2px solid #3c4043;display:flex;
  align-items:center;justify-content:center;font-size:52px;color:#f1f3f4}
#pin span.cur{border:3px solid #e8eaed}
</style><script src="qrcode.js"></script></head><body><div class="frame">
<img class="brand" src="logo-wide.png" alt="">
<div class="main">
  <div class="text">
    <h1 id="title">Starting…</h1><p id="msg">Connecting to your private network.</p>
    <ol id="steps" style="display:none"><li>Open <b>Claude</b> on your phone or computer.</li>
      <li>Go to your <b>Claude's Computer</b> session.</li><li>Say <b>“desktop on”</b>.</li></ol>
    <div id="pin"><span></span><span></span><span></span><span></span></div><p id="hint"></p>
    <p class="url" id="url"></p><p class="small" id="detail"></p>
  </div>
  <div class="side"><div id="qr"></div><div id="icon"></div></div>
</div></div><script>
// Line icons (Material), drawn in one colour. The app passes some of them by name (the emoji it used to show).
var ICONS = {
  asleep: '<svg viewBox="0 0 24 24"><path d="M12.34 2.02C6.59 1.82 2 6.42 2 12c0 5.52 4.48 10 10 10 3.71 0 6.93-2.02 8.66-5.02-7.51-.25-12.09-8.43-8.32-14.96z"/></svg>',
  offline: '<svg viewBox="0 0 24 24"><path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zm-6.6 8.22L3.27 1.44 2 2.72l2.05 2.06C1.91 5.76.59 6.82.36 7l11.63 14.49.01.01.01-.01 3.9-4.86 3.32 3.32 1.27-1.27-3.46-3.46z"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>',
  done: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>',
  warning: '<svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>',
  busy: '<div class="spin"></div>'
};
var BY_EMOJI = {"\u{1F511}": "lock", "✅": "done", "⚠️": "warning", "⚠": "warning", "⏳": "busy"};
function setIcon(name) {
  var ic = document.getElementById("icon"), html = ICONS[BY_EMOJI[name] || name];
  if (html) { ic.innerHTML = html; ic.style.display = "block"; }
}

// Called by the app: kind is the node state ("NeedsLogin", "Starting", "Running", ...) or one of
// "offline", "checking", "asleep". retryMs: how often the app checks again on its own.
var lastUrl = "", timer = null, wakeHint = "";
// Called by the app. setWakeHint: the extra line on the asleep screen. panel: a plain message. pin: the PIN pad
// (n digits entered so far; cur is the digit being chosen with the remote's up/down, or -1).
function setWakeHint(text) { wakeHint = text || ""; var h = document.getElementById("hint"); if (h.dataset.on === "1") { h.textContent = wakeHint; } }
function clearAll() {
  if (timer) { clearInterval(timer); timer = null; }
  ["qr", "steps", "icon"].forEach(function (id) { show(id, false); });
  document.getElementById("pin").style.display = "none";
  var h = document.getElementById("hint"); h.style.display = "none"; h.dataset.on = "0";
  document.getElementById("url").textContent = ""; document.getElementById("detail").textContent = "";
}
function panel(title, msg, detail, icon) {
  clearAll();
  document.getElementById("title").textContent = title; document.getElementById("msg").textContent = msg;
  document.getElementById("detail").textContent = detail || "";
  if (icon) setIcon(icon);
}
function pin(title, msg, n, cur, detail) {
  panel(title, msg, detail, "lock");
  var boxes = document.querySelectorAll("#pin span");
  for (var i = 0; i < boxes.length; i++) {
    boxes[i].textContent = i < n ? "•" : (i === n && cur >= 0 ? String(cur) : "");
    boxes[i].className = i === n ? "cur" : "";
  }
  document.getElementById("pin").style.display = "flex";
}
function show(id, on) { document.getElementById(id).style.display = on ? "block" : "none"; }
function setStatus(kind, url, err, retryMs) {
  var t = document.getElementById("title"), m = document.getElementById("msg"),
      u = document.getElementById("url"), q = document.getElementById("qr"), d = document.getElementById("detail");
  clearAll();
  d.textContent = err ? err : "";
  if (kind === "NeedsLogin" && url) {
    t.textContent = "Connect this TV";
    m.textContent = "Scan the code with your phone and sign in to Tailscale, the private network between this TV and your computer. You only do this once.";
    u.textContent = url;
    if (url !== lastUrl) {
      lastUrl = url;
      var qr = qrcode(0, "M"); qr.addData(url); qr.make();
      q.innerHTML = qr.createImgTag(10, 0);
    }
    show("qr", true);
  } else if (kind === "NeedsLogin" || kind === "NeedsMachineAuth") {
    setIcon("busy");
    t.textContent = "Signing in…";
    m.textContent = kind === "NeedsMachineAuth"
      ? "This TV is waiting to be approved in your Tailscale admin console."
      : "Getting a sign-in code from Tailscale.";
  } else if (kind === "offline") {
    setIcon("offline");
    t.textContent = "No internet";
    m.textContent = "This TV isn't connected to the internet. Check its Wi-Fi or network cable. This screen continues by itself once it's back.";
  } else if (kind === "checking" || kind === "Running") {
    setIcon("busy");
    t.textContent = "Looking for your computer…"; m.textContent = "Connected to your private network.";
  } else if (kind === "asleep") {
    setIcon("asleep");
    t.textContent = "Your computer is asleep";
    m.textContent = "It sleeps when nobody is using it. To start it:";
    show("steps", true);
    var h = document.getElementById("hint"); h.textContent = wakeHint; h.style.display = "block"; h.dataset.on = "1";
    var left = Math.round((retryMs || 10000) / 1000), n = left;
    d.textContent = "Checking again in " + n + " s.";
    timer = setInterval(function () { n = n > 1 ? n - 1 : left; d.textContent = n === left ? "Checking…" : "Checking again in " + n + " s."; }, 1000);
  } else if (kind === "Error") {
    setIcon("warning");
    t.textContent = "Couldn't connect"; m.textContent = "This TV couldn't join your private network (Tailscale). It keeps trying.";
  } else {
    setIcon("busy");
    t.textContent = "Starting…"; m.textContent = "Connecting to your private network (Tailscale).";
  }
}
</script></body></html>
