# Builds Claude's Computer as a ready-made Docker image (see Dockerfile), starts it, checks that the desktop comes up
# and that Tailscale offers a sign-in link, and only then publishes it to ghcr.io/claudes-computer/claudes-computer.
# Runs when the installer or the image changes, and by hand (Actions -> Docker image -> Run workflow).
name: Docker image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cloud/**", "Dockerfile", ".dockerignore", ".github/workflows/docker-image.yml"]
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-image
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/claudes-computer/claudes-computer
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t "$IMAGE:test" . 2>&1 | tail -40
      - name: Start it and check the desktop
        run: |
          docker run -d --name ccrd --shm-size=2g -e CCRD_NAME=lab "$IMAGE:test"
          for i in $(seq 1 60); do
            code=$(docker exec ccrd curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6081/ 2>/dev/null || true)
            [ "$code" = 200 ] && break; sleep 5
          done
          echo "desktop page: $code after $((i*5)) s"
          for i in $(seq 1 24); do docker logs ccrd 2>&1 | grep -q "login.tailscale.com" && break; sleep 5; done
          mkdir -p out
          docker logs ccrd 2>&1 | sed -E 's#(login.tailscale.com/a/)[A-Za-z0-9]+#\1<link>#' | tail -30 | tee out/start.log
          docker exec ccrd runuser -u desk -- env DISPLAY=:1 import -window root /tmp/desktop.png 2>/dev/null \
            && docker cp ccrd:/tmp/desktop.png out/desktop.png || echo "(no screenshot tool in the image)"
          docker exec ccrd bash -c 'ls /opt/ccrd | wc -l; /opt/ccrd/tailscaled --version | head -1; ls -la /opt/firefox/firefox; pgrep -a xfce4-session | head -1' | tee -a out/start.log
          {
            echo "desktop page: $code"; echo "image size: $(docker image inspect "$IMAGE:test" --format '{{.Size}}' | awk '{printf "%.1f GB", $1/1e9}')"
            grep -q "login.tailscale.com" out/start.log && echo "Tailscale sign-in link: offered" || echo "Tailscale sign-in link: NOT offered"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$code" = 200 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-image-check
          path: out
      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:test" "$IMAGE:latest"
          docker tag "$IMAGE:test" "$IMAGE:${GITHUB_SHA::7}"
          docker push -q "$IMAGE:latest"
          docker push -q "$IMAGE:${GITHUB_SHA::7}"
          echo "published: $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
