# Runs the published desktop image without Docker (cloud/run-from-image.sh), as on a sandbox where you're root
# but only the home folder is kept, and checks that the desktop session itself runs.
name: Desktop without Docker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cloud/run-from-image.sh", "cloud/keep-in-home.sh", ".github/workflows/run-from-image.yml"]
permissions:
  contents: read
jobs:
  chroot:
    # Runs in the public repository only; private copies would run it twice and can't publish.
    if: github.repository == 'claudes-computer/claudes-computer'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: First start (downloads and unpacks the image)
        run: |
          sudo systemctl stop docker docker.socket 2>/dev/null || true
          sudo mkdir -p /mnt/h /mnt/inbox; sudo HOME=/mnt/h CCRD_INBOX=/mnt/inbox CCRD_INBOX_NAME=Muse bash cloud/keep-in-home.sh lab | tee out.txt
          grep -q '^SIGN IN: https://login.tailscale.com/' out.txt
          grep -q '^running:.*xfce4-session=up' out.txt
      - name: The desktop session runs
        run: |
          for i in $(seq 1 24); do pgrep -x xfce4-session >/dev/null && break; sleep 5; done
          pgrep -a xfce4-session
          for i in $(seq 1 30); do c=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6081/); [ "$c" = 200 ] && break; sleep 5; done
          echo "desktop page: $c"; [ "$c" = 200 ]
      - name: The inbox copies a new picture onto the desktop
        run: |
          sudo cp tv-app/res/drawable/*.png /mnt/inbox/test.png 2>/dev/null || printf 'RIFF....WEBP' | sudo tee /mnt/inbox/test.webp >/dev/null
          for i in $(seq 1 6); do sudo ls /mnt/h/ccrd-root/rootfs/home/desk/Desktop/Muse/ 2>/dev/null | grep -q test && break; sleep 5; done
          sudo ls -la /mnt/h/ccrd-root/rootfs/home/desk/Desktop/Muse/
          sudo ls /mnt/h/ccrd-root/rootfs/home/desk/Desktop/Muse/ | grep -q test
      - name: The request box (report, then restart) works from inside the desktop's world
        run: |
          F=/mnt/h/ccrd-root/rootfs
          echo report | sudo tee $F/state/ccrd-request >/dev/null
          for i in $(seq 1 12); do sudo test -s $F/state/ccrd-report && break; sleep 5; done; sudo cat $F/state/ccrd-report
          sudo grep -q "^running:" $F/state/ccrd-report
          old=$(pgrep -x xfce4-session); echo restart | sudo tee $F/state/ccrd-request >/dev/null
          for i in $(seq 1 36); do n=$(pgrep -x xfce4-session); [ -n "$n" ] && [ "$n" != "$old" ] && break; sleep 5; done
          echo "xfce4-session before $old, after $n"; [ -n "$n" ] && [ "$n" != "$old" ]
      - name: Stop, then start again from the unpacked folder (as after the machine is replaced)
        run: |
          sudo CCRD_ROOT=/mnt/h/ccrd-root bash cloud/run-from-image.sh stop
          sleep 3; ! pgrep -x xfce4-session
          start=$(date +%s)
          sudo CCRD_ROOT=/mnt/h/ccrd-root CCRD_NAME=lab bash cloud/run-from-image.sh | tee out2.txt
          grep -q '^SIGN IN:' out2.txt; ! grep -q 'Getting the desktop image' out2.txt
          for i in $(seq 1 24); do pgrep -x xfce4-session >/dev/null && break; sleep 5; done
          pgrep -a xfce4-session; echo "restart took $(( $(date +%s) - start )) s"
      - name: Update to the newest image (as Muse does), keeping the identity and the desktop's files
        run: |
          sudo touch /mnt/h/ccrd-root/rootfs/home/desk/keep-me
          sudo /mnt/h/computer/start --update | tee out3.txt
          grep -q '^SIGN IN:\|^READY' out3.txt
          sudo test -f /mnt/h/ccrd-root/rootfs/home/desk/keep-me
          for i in $(seq 1 24); do pgrep -x xfce4-session >/dev/null && break; sleep 5; done; pgrep -a xfce4-session
          ! grep -q " /mnt/h/ccrd-root/.old" /proc/mounts
      - name: The short report
        run: sudo /mnt/h/computer/start report
      - if: failure()
        run: |
          sudo tail -60 /mnt/h/ccrd-root/start.log || true
          sudo tail -40 /mnt/h/ccrd-root/update.log || true
          sudo journalctl -u ccrd-update -u ccrd-desktop --no-pager | tail -40 || true
