# The test lab: builds the TV app and tries it on Android TV emulators (Android 9, 11 and 14), no real TV needed.
# It installs the app and its helper, opens the app, applies the helper's settings, turns the TV off and on,
# restarts it and looks for crashes (tools/tv-lab-test.sh). Screenshots and logs are kept as the run's artifacts.
# Runs when the TV app or the helper changes, and by hand (Actions -> TV lab -> Run workflow).
name: TV lab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tv-app/**", "helper/**", "tools/tv-lab-test.sh", ".github/workflows/tv-lab.yml"]
permissions:
  contents: read
concurrency:
  group: tv-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build (ARM for TVs, x86 for the emulators; throwaway signing key)
        run: ABIS=android/arm,android/386 bash tv-app/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lab-apk
          path: tv-app/out/claudes-computer.apk
  tv:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [28, 30, 34]
    name: Android TV (API ${{ matrix.api }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lab-apk
          path: apk
      - name: Let the emulator use the machine's virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          script: bash tools/tv-lab-test.sh apk/claudes-computer.apk lab-out
      - name: Summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat lab-out/summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-android-${{ matrix.api }}
          path: lab-out
